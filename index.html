<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalentMap AI - Secure Resume Analysis Platform</title>
    <meta name="description" content="TalentMap AI - Secure, privacy-first AI-driven resume analysis platform with client-side processing. No data transmission, GDPR compliant." />
    <meta name="author" content="Shyaka Chaste" />
    <meta name="keywords" content="resume analysis, AI, secure, privacy-first, GDPR compliant, client-side processing" />
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), screen-wake-lock=()" />
    
    <!-- Privacy and Security Meta Tags -->
    <meta name="robots" content="index, follow, noarchive, nosnippet" />
    <meta name="privacy-policy" content="No data collection - All processing happens locally in your browser" />
    <meta name="data-protection" content="GDPR compliant - No personal data transmitted or stored" />

    <!-- Enhanced Open Graph with Security Focus -->
    <meta property="og:title" content="TalentMap AI - Secure Resume Analysis Platform" />
    <meta property="og:description" content="Privacy-first AI resume analysis. All processing happens locally in your browser. No data transmission. GDPR compliant." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image-secure.png" />
    <meta property="og:image:alt" content="TalentMap AI - Secure Resume Analysis Platform" />
    <meta property="og:site_name" content="TalentMap AI" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TalentMap AI - Secure Resume Analysis" />
    <meta name="twitter:description" content="Privacy-first AI resume analysis platform with client-side processing" />
    <meta name="twitter:image" content="/twitter-card-secure.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
